# Configuración de Supervisor para Laravel Horizon
# TrainingMS - Sistema de Evaluaciones NOM-035-STPS-2018
# =====================================================

[program:trainingms-horizon]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/trainingms/artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stopwaitsecs=3600
priority=999

# Configuración específica para evaluaciones NOM-035
environment=APP_ENV=production,QUEUE_CONNECTION=redis,CACHE_STORE=redis

# Configuración de reinicio automático en caso de fallo
startretries=10
exitcodes=0,2
stopsignal=TERM

# Configuración de logs con rotación
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/horizon-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

# Variables de entorno adicionales para producción
environment=
    APP_ENV="production",
    QUEUE_CONNECTION="redis",
    CACHE_STORE="redis",
    REDIS_HOST="127.0.0.1",
    REDIS_PORT="6379",
    MAIL_FROM_ADDRESS="alfredo@nhoamx.com"

# Configuración para manejo de memoria
minfds=1024
minprocs=200